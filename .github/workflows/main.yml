name: Auto Generate Content Bola

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  update-berita:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil data repositori
      uses: actions/checkout@v4

    - name: Menyiapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Menginstal Modul Python
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai

    - name: Menjalankan Script Scraper & Gemini
      env:
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: python src/main.py

    - name: Menyimpan Artikel ke GitHub (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/berita/*.html public/index.html || true
        git commit -m "Auto-update: Tambah artikel & perbarui homepage" || echo "Tidak ada perubahan data"
        git push
