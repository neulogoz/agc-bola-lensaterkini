name: Auto Generate Berita Bola

on:
  schedule:
    # Berjalan setiap 4 jam waktu UTC (Setara jam 07:00, 11:00, 15:00, 19:00, 23:00, 03:00 WIB)
    - cron: '0 */4 * * *' 
  # Tombol "Run Workflow" manual
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Tarik Data Repo
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Modul (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai google-auth

      - name: 🤖 Eksekusi Robot Pembuat Berita
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # INI BARIS YANG HILANG SEBELUMNYA: Memberikan kunci JSON ke Python
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python src/main.py

      - name: Simpan dan Upload Artikel Baru (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Lensa Terkini Bot"
          git add public/
          git commit -m "Auto-update: Menerbitkan Berita Bola Terbaru & Update Sitemap 🚀" || echo "Belum ada berita baru dari sumber"
          git push
